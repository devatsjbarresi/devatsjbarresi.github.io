title: ShowShark
logo: "/assets/showshark_logo_blue.svg"
theme: just-the-docs

# URLs
url: "https://showshark.net"
baseurl: ""

# Core
search_enabled: true
color_scheme: light

# Markdown processing
markdown: kramdown
kramdown:
  parse_block_html: true
  parse_span_html: true

# Local working notes are not part of the published site.
exclude:
  - WORKSHOP_NOTES.local.md

# Collections
collections:
  documentation:
    output: true
    permalink: /docs/:path/

# Just the Docs
just_the_docs:
  collections:
    documentation:
      name: Documentation
      nav_fold: true
  main:
    collection: documentation

# Custom footer content
footer_content: 'Copyright &copy; 2026 ShowShark. <br><br><script async src="https://js.stripe.com/v3/buy-button.js"></script><stripe-buy-button buy-button-id="buy_btn_1SoodyIHixNQvAkemtH2Yw6X" publishable-key="pk_live_51SonwpIHixNQvAke1GDZi4hdSUx8m2pcazdFISDcBkaL968phkjcQygePFOPJDKKn6j1l3EPduqFZrZJl4BEVJZp00FJ895JPY"></stripe-buy-button>'

# Auxiliary links for top navigation
aux_links:
  "Contact / Share a Capture": "/contact/"
