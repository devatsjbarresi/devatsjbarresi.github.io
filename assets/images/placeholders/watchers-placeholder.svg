<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Watchers Screenshot Placeholder</title>
  <desc id="desc">Placeholder panel for upcoming ShowShark Watchers screenshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f4f8"/>
      <stop offset="100%" stop-color="#dfe6ef"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="80" width="1120" height="560" rx="16" fill="#ffffff" stroke="#9aa7b8" stroke-width="3"/>
  <g fill="#5a6b80" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="640" y="320" font-size="48" font-weight="700">Watchers Screenshot Placeholder</text>
    <text x="640" y="370" font-size="26">Replace this image with a real Watchers UI screenshot</text>
  </g>
</svg>
